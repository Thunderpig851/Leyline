services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    env_file:
      - ./server/.env
    environment:
      - OCR_SERVICE_URL=http://ocr-service:8000
    ports:
      - "3001:3001"
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"
    volumes:
      - ./server:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]
    depends_on:
      - ocr-service
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    env_file:
      - ./web/.env
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      - server
    restart: unless-stopped

  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    environment:
      - PORT=8000
      - PADDLEOCR_MODEL_NAME=en_PP-OCRv5_mobile_rec
      - PADDLEOCR_DEVICE=cpu
    ports:
      - "8000:8000"
    volumes:
      - ./ocr-service:/app
    restart: unless-stopped

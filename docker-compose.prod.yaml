services:
  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    environment:
      - PORT=8000
      - REQUEST_BODY_LIMIT=50mb
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      - OCR_SERVICE_URL=http://ocr-service:8000
      - OCR_PROXY_TIMEOUT_MS=30000
      - REQUEST_BODY_LIMIT=50mb
    expose:
      - "3001"
    ports:
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"
    depends_on:
      ocr-service:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - server
    restart: unless-stopped

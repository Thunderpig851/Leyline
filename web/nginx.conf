map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream leyline_server {
  server server:3001;
}

server {
  listen 80;
  server_name ley-line.dev www.ley-line.dev;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name ley-line.dev www.ley-line.dev;
  client_max_body_size 50m;

  ssl_certificate /etc/letsencrypt/live/ley-line.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ley-line.dev/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/card-id/ {
    client_max_body_size 50m;
    proxy_pass http://leyline_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_connect_timeout 15s;
  }

  location /api/ {
    proxy_pass http://leyline_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://leyline_server;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
  }
}

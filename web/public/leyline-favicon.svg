      <stop stop-color="#0b1117" />
      <stop offset="1" stop-color="#14202b" />
    </linearGradient>
    <linearGradient id="llGlow" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399" />
      <stop offset="0.5" stop-color="#14b8a6" />
